name: Release

# Push a tag like v0.2.0 to build installers for all platforms and publish them as a GitHub
# release. Installed apps update themselves from these releases (Velopack).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without v), e.g. 0.2.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64,     channel: win,       exe: tmax.exe }
          - { os: windows-latest, rid: win-arm64,   channel: win-arm64, exe: tmax.exe }
          - { os: macos-latest,   rid: osx-arm64,   channel: osx,       exe: tmax }
          - { os: macos-13,       rid: osx-x64,     channel: osx-x64,   exe: tmax }
          - { os: ubuntu-latest,  rid: linux-x64,   channel: linux,     exe: tmax }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Normalize version
        shell: bash
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Publish self-contained app
        shell: bash
        run: >
          dotnet publish src/Tmax.App -c Release -r ${{ matrix.rid }} --self-contained -o publish
          -p:Version=$VERSION
          -p:TmaxUpdateRepo=${{ github.server_url }}/${{ github.repository }}

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      # Previous release lets vpk build delta packages (small updates).
      - name: Download previous release
        shell: bash
        continue-on-error: true
        run: vpk download github --repoUrl ${{ github.server_url }}/${{ github.repository }} --channel ${{ matrix.channel }} --token ${{ secrets.GITHUB_TOKEN }}

      - name: Pack installer
        shell: bash
        run: >
          vpk pack --packId tmax.net --packVersion $VERSION --packDir publish --mainExe ${{ matrix.exe }}
          --packTitle tmax --channel ${{ matrix.channel }}
          ${{ startsWith(matrix.rid, 'win') && '--icon assets/icon.ico' || '' }}

      - name: Upload to GitHub release
        shell: bash
        run: >
          vpk upload github --repoUrl ${{ github.server_url }}/${{ github.repository }} --channel ${{ matrix.channel }}
          --publish --merge --releaseName "tmax.net $VERSION" --tag v$VERSION --token ${{ secrets.GITHUB_TOKEN }}
